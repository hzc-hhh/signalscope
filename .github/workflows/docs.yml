name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "signalscope/**"
      - "mkdocs.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[docs]"

      - name: Build and deploy docs
        run: mkdocs gh-deploy --force
