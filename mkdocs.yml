# SignalScope Documentation

site_name: SignalScope
site_description: Unified AI Research Framework for Biomedical Sensor Signals
site_url: https://signalscope.github.io

repo_name: signalscope/signalscope
repo_url: https://github.com/signalscope/signalscope

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [signalscope]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - footnotes
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
    - Sensor Preprocessing: sensor-preprocessing.md
    - Model Zoo: model-zoo.md
    - Evaluation: evaluation.md
    - Benchmark: benchmark.md
    - Interpretability: interpretability.md
  - Examples:
    - Quickstart: examples/quickstart.ipynb
  - API Reference:
    - Preprocessing: api/preprocessing.md
    - Models: api/models.md
    - Evaluation: api/evaluation.md
    - Benchmark: api/benchmark.md
  - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/signalscope/signalscope
